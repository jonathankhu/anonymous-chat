<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <title>匿名聊天室</title>
  <link rel="icon" href="data:,">
  <!-- 所有路徑都用相對路徑：GitHub Pages 網址帶有專案名稱的子路徑 -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main id="app">

    <!-- 畫面 A：輸入代號 -->
    <section id="screen-entry" class="screen screen--entry">
      <form id="entry-form" class="entry" novalidate>
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.7 8.7 0 0 1-3.6-.8L3 20l1.1-4.9A8.4 8.4 0 1 1 21 11.5z"/>
            <path d="M9 11.5h.01M12.5 11.5h.01M16 11.5h.01"/>
          </svg>
        </span>
        <h1 class="entry__title">歡迎來到匿名聊天室</h1>
        <p class="entry__lead">不用註冊，取個代號就能和大家聊天。</p>
        <p class="entry__notice">
          這是公開聊天室，任何人都看得到你的訊息與檔案；離開後你就看不到先前的內容。
        </p>

        <label class="field__label" for="nickname-input">你的代號（1 到 20 個字，中文、英文、數字）</label>
        <input id="nickname-input" class="field__input" type="text" inputmode="text"
               autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40"
               placeholder="例如：小花、Mia88">
        <p id="entry-error" class="field__error" role="alert"></p>

        <button id="enter-btn" class="btn btn--primary" type="submit" disabled>進入</button>
      </form>
    </section>

    <!-- 畫面 B：聊天室 -->
    <section id="screen-chat" class="screen screen--chat" hidden>
      <header class="chat__header">
        <span class="brand-icon brand-icon--sm" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.7 8.7 0 0 1-3.6-.8L3 20l1.1-4.9A8.4 8.4 0 1 1 21 11.5z"/>
            <path d="M9 11.5h.01M12.5 11.5h.01M16 11.5h.01"/>
          </svg>
        </span>
        <div class="chat__heading">
          <h1 class="chat__title">匿名聊天室</h1>
          <p id="online-count" class="chat__online">目前 0 人在線</p>
        </div>
        <button id="leave-btn" class="btn btn--ghost" type="button">離開</button>
      </header>

      <div id="scroller" class="chat__body">
        <ol id="message-list" class="messages"></ol>
        <p id="empty-hint" class="messages__empty">還沒有人說話</p>
      </div>
      <button id="new-msg-btn" class="new-msg" type="button" hidden>有新訊息 ↓</button>

      <form id="composer" class="composer" novalidate>
        <div id="file-chip" class="composer__chip" hidden>
          <span id="file-chip-name" class="composer__chip-name"></span>
          <button id="file-remove-btn" class="composer__chip-remove" type="button"
                  aria-label="取消附加檔案">✕</button>
        </div>
        <div class="composer__row">
          <button id="attach-btn" class="icon-btn" type="button" aria-label="附加檔案">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <input id="file-input" type="file" hidden>
          <textarea id="text-input" class="composer__input" rows="1"
                    placeholder="輸入訊息…" aria-label="訊息"></textarea>
          <button id="send-btn" class="btn btn--primary" type="submit" disabled>送出</button>
        </div>
        <p id="char-hint" class="composer__hint" aria-live="polite"></p>
      </form>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <noscript>這個聊天室需要啟用 JavaScript 才能使用。</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
